name: release

# push a tag like v0.1.0 and this handles the rest:
# full check, npm publish with provenance, github release with notes.
# needs an NPM_TOKEN secret (automation token) set in repo settings.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Install as a Claude Code plugin:
            ```
            /plugin marketplace add 0ss/pantry
            /plugin install pantry@pantry
            ```
            Full changes in [CHANGELOG.md](https://github.com/0ss/pantry/blob/main/CHANGELOG.md).
